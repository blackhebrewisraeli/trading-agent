name: ZeroChart Daily Scan

on:
  # Allow manual runs from the GitHub Actions UI.
  workflow_dispatch:

  # Run weekdays after the US market close (16:00 ET).
  # US close in UTC: 20:00 (summer/EDT) and 21:00 (winter/EST), so a single
  # 21:30 UTC trigger is always after the close:
  #   - Winter (Israel Standard Time, UTC+2): 23:30 Israel time
  #   - Summer (Israel Daylight Time, UTC+3): 00:30 Israel time (next day)
  schedule:
    - cron: '30 21 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ZeroChart agent
        run: python agent.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
